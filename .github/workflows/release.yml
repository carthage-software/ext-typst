name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "*"

permissions:
  contents: write
  attestations: write
  id-token: write

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  metadata:
    name: Extract metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract version
        id: version
        run: |
          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}"

      - name: Check for release
        id: is-release
        run: |
          unset IS_RELEASE
          if [[ "$GITHUB_REF" =~ ^refs/tags/[0-9].* ]]; then
            IS_RELEASE='true'
          fi
          echo "IS_RELEASE=${IS_RELEASE}" >> "$GITHUB_OUTPUT"

    outputs:
      version: ${{ steps.version.outputs.version }}
      is-release: ${{ steps.is-release.outputs.IS_RELEASE }}

  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    needs: metadata
    if: needs.metadata.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Create draft release
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: PHP ${{ matrix.php }}-${{ matrix.ts }} (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [metadata, create-release]
    if: always() && needs.metadata.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14]
        php: ["8.3", "8.4", "8.5"]
        ts: [nts, ts]
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            arch: x86_64
            platform: linux
            libc: glibc
            ext-file: libext_typst.so
            so-name: typst.so
          - os: ubuntu-24.04-arm
            name: linux-aarch64
            arch: aarch64
            platform: linux
            libc: glibc
            ext-file: libext_typst.so
            so-name: typst.so
          - os: macos-14
            name: darwin-arm64
            arch: arm64
            platform: darwin
            libc: bsdlibc
            ext-file: libext_typst.dylib
            so-name: typst.so

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.os }}-php${{ matrix.php }}-${{ matrix.ts }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        env:
          phpts: ${{ matrix.ts }}
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Verify PHP thread safety
        run: |
          expected="${{ matrix.ts }}"
          actual=$(php -r "echo PHP_ZTS ? 'ts' : 'nts';")
          if [ "$expected" != "$actual" ]; then
            echo "::error::Expected PHP $expected but got $actual"
            exit 1
          fi

      - name: Build extension
        run: cargo build --release

      - name: Verify extension loads
        run: |
          php -d display_startup_errors=1 \
            -d "extension=$GITHUB_WORKSPACE/target/release/${{ matrix.ext-file }}" \
            -r 'if (!extension_loaded("typst")) { fwrite(STDERR, "error: typst extension failed to load\n"); exit(1); } echo "typst extension loaded\n";'

      - name: Install Composer dependencies
        run: composer update --no-interaction --prefer-dist --ignore-platform-req=ext-typst

      - name: Run PHPUnit
        run: |
          php -d "extension=$GITHUB_WORKSPACE/target/release/${{ matrix.ext-file }}" \
            vendor/bin/phpunit

      - name: Package binary
        id: package
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          TS_SUFFIX=""
          if [ "${{ matrix.ts }}" = "ts" ]; then
            TS_SUFFIX="-zts"
          fi

          archs="${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            archs="aarch64 arm64"
          fi

          for arch in $archs; do
            name="php_typst-${VERSION}_php${{ matrix.php }}-${arch}-${{ matrix.platform }}-${{ matrix.libc }}${TS_SUFFIX}"
            staging="_release/${name}"
            mkdir -p "${staging}"
            cp "target/release/${{ matrix.ext-file }}" "${staging}/${{ matrix.so-name }}"
            ( cd _release && zip -r "${name}.zip" "${name}" )
          done

          # Name used for the (unique) CI artifact of this job.
          PKG_NAME="php_typst-${VERSION}_php${{ matrix.php }}-${{ matrix.arch }}-${{ matrix.platform }}-${{ matrix.libc }}${TS_SUFFIX}"
          echo "PKG_NAME=${PKG_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: _release/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: _release/*.zip

      - name: Upload to release
        if: needs.metadata.outputs.is-release == 'true'
        run: gh release upload "${{ github.ref_name }}" _release/*.zip --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-musl:
    name: PHP ${{ matrix.php }}-nts (linux-${{ matrix.arch }}-musl)
    runs-on: ${{ matrix.os }}
    needs: [metadata, create-release]
    if: always() && needs.metadata.result == 'success' && (needs.create-release.result == 'success' || needs.create-release.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        php: ["8.3", "8.4", "8.5"]
        include:
          - os: ubuntu-latest
            arch: x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-musl-${{ matrix.arch }}-php${{ matrix.php }}-nts

      # JavaScript actions cannot run in ARM64 Alpine job containers.
      - name: Build and verify extension in Alpine
        run: |
          mkdir -p target "$HOME/.cargo/registry"
          trap 'sudo chown -R "$(id -u):$(id -g)" target "$HOME/.cargo/registry"' EXIT
          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/app" \
            -v "$HOME/.cargo/registry:/root/.cargo/registry" \
            -w /app -e CARGO_TERM_COLOR \
            php:${{ matrix.php }}-cli-alpine sh -eu <<'SH'
          apk add --no-cache bash build-base clang16-libclang curl git linux-headers openssl
          curl -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
          . "$HOME/.cargo/env"
          export LIBCLANG_PATH=/usr/lib/llvm16/lib
          export BINDGEN_EXTRA_CLANG_ARGS=-I/usr/lib/llvm16/lib/clang/16/include

          actual=$(php -r "echo PHP_ZTS ? 'ts' : 'nts';")
          if [ "nts" != "$actual" ]; then
            echo "::error::Expected PHP nts but got $actual"
            exit 1
          fi

          cargo build --release
          ldd target/release/libext_typst.so || true
          SH

          docker run --rm -i \
            -v "$GITHUB_WORKSPACE:/app:ro" \
            -w /app php:${{ matrix.php }}-cli-alpine sh -eu <<'SH'
          apk add --no-cache libgcc
          php -d display_startup_errors=1 \
            -d "extension=$PWD/target/release/libext_typst.so" \
            -r 'if (!extension_loaded("typst")) { fwrite(STDERR, "error: typst extension failed to load\n"); exit(1); } echo "typst extension loaded\n";'
          SH

      - name: Package binary
        id: package
        run: |
          VERSION="${{ needs.metadata.outputs.version }}"
          archs="${{ matrix.arch }}"
          if [ "${{ matrix.arch }}" = "aarch64" ]; then
            archs="aarch64 arm64"
          fi

          for arch in $archs; do
            name="php_typst-${VERSION}_php${{ matrix.php }}-${arch}-linux-musl"
            staging="_release/${name}"
            mkdir -p "${staging}"
            cp "target/release/libext_typst.so" "${staging}/typst.so"
            ( cd _release && zip -r "${name}.zip" "${name}" )
          done

          PKG_NAME="php_typst-${VERSION}_php${{ matrix.php }}-${{ matrix.arch }}-linux-musl"
          echo "PKG_NAME=${PKG_NAME}.zip" >> "$GITHUB_OUTPUT"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: _release/*.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.package.outputs.PKG_NAME }}
          path: _release/*.zip

      - name: Upload to release
        if: needs.metadata.outputs.is-release == 'true'
        run: gh release upload "${{ github.ref_name }}" _release/*.zip --clobber --repo "${{ github.repository }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    needs: [metadata, build, build-musl]
    if: needs.metadata.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Publish release
        run: gh release edit "${{ github.ref_name }}" --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
